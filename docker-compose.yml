services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - analytics
  mongodb:
    image: mongo:latest
    container_name: mongodb
    hostname: mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - analytics    
  micro-streaming-analytics:
    container_name: micro-streaming-analytics
    build:
      context: .
      dockerfile: Dockerfile
    image: micro-streaming-analytics:latest
    restart: always
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_MONGODB_HOST: mongodb
    networks:
      - analytics
    depends_on:
      - mongodb
      - rabbitmq
networks:
  analytics:
  